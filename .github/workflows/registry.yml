name: Plugin registry

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: registry-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out trusted validator from PR base
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - name: Check out submitted data (never execute it)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          path: submitted
          persist-credentials: false
      - name: Test trusted validator
        run: python3 -I -m unittest discover -s trusted -v
      - name: Check out pinned official package checker source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: qinains/i
          ref: 71b3db2c3195870ba9ecc3fad2dd2d4c75532e8d # Audited official checker, not plugin source.
          path: validator-source
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.95.0
      - name: Build official checker (never build submitted plugin source)
        run: cargo build --manifest-path validator-source/Cargo.toml --locked -p i-wasm-package --features cli --bin i-plugin-check
      - name: Validate all proposed entries and packages using trusted code
        run: python3 -I trusted/registry.py --extensions submitted/extensions --base trusted/extensions --checker "$PWD/validator-source/target/debug/i-plugin-check"

  build:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: python3 -I -m unittest discover -s . -v
      - name: Check out pinned official package checker source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: qinains/i
          ref: 71b3db2c3195870ba9ecc3fad2dd2d4c75532e8d # Audited official checker, not plugin source.
          path: validator-source
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.95.0
      - name: Build official checker (never build submitted plugin source)
        run: cargo build --manifest-path validator-source/Cargo.toml --locked -p i-wasm-package --features cli --bin i-plugin-check
      - run: python3 -I registry.py --output dist --checker "$PWD/validator-source/target/debug/i-plugin-check"
      - name: Upload public catalog and mirrored packages only
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
